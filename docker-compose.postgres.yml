version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: harmonia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: harmonia
      POSTGRES_USER: harmonia_user
      POSTGRES_PASSWORD: harmonia_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - harmonia-network

  redis:
    image: redis:7-alpine
    container_name: harmonia-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - harmonia-network

  # Optional: Database administration tool
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: harmonia-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@harmonia.local
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - '8080:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - harmonia-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  harmonia-network:
    driver: bridge
